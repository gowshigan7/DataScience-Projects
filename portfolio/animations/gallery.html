<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS / AI / CS — animation set</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0a0c; --fg:#f3eee9; --muted:#b0a6a0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:"Inter",system-ui,sans-serif; padding:48px 32px 80px; }
    header { max-width:1200px; margin:0 auto 36px; }
    h1 { font-size:1.7rem; letter-spacing:-0.02em; margin:0 0 6px; }
    p { color:var(--muted); margin:0; font-size:0.95rem; }
    .grid { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    figure { margin:0; border:1px solid #2a2630; border-radius:14px; overflow:hidden; background:#0e0d0f; }
    figure canvas { width:100%; height:auto; display:block; }
    figcaption { font-family:"JetBrains Mono",monospace; font-size:0.8rem; color:var(--muted); padding:12px 16px; border-top:1px solid #2a2630; }
  </style>
</head>
<body>
  <header>
    <h1>Data Science · AI · Computer Science — animation set</h1>
    <p>Ten uniform 6-second loops, one shared visual system. Click a tile to open it full-size.</p>
  </header>
  <div class="grid" id="grid"></div>

  <script src="engine.js"></script>
  <script src="scenes/01-latent-space.js"></script>
  <!-- add scenes 02–10 here as they are built -->
  <script>
    const grid = document.getElementById('grid');
    for (const scene of window.Anim.list()) {
      const fig = document.createElement('figure');
      const cv = document.createElement('canvas');
      const cap = document.createElement('figcaption');
      cap.textContent = scene.id + '  //  ' + scene.label;
      const link = document.createElement('a');
      link.href = 'scene.html?scene=' + scene.id; link.style.display = 'block';
      link.appendChild(cv);
      fig.appendChild(link); fig.appendChild(cap); grid.appendChild(fig);
      window.Anim.mount(cv, scene.id).play();
    }
  </script>
</body>
</html>
