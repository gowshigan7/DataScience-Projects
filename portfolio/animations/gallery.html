<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS / AI / CS — animation set</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0a0c; --fg:#f3eee9; --muted:#b0a6a0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:"Inter",system-ui,sans-serif; padding:48px 32px 80px; }
    header { max-width:1200px; margin:0 auto 36px; }
    h1 { font-size:1.7rem; letter-spacing:-0.02em; margin:0 0 6px; }
    p { color:var(--muted); margin:0; font-size:0.95rem; }
    .grid { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    figure { margin:0; border:1px solid #2a2630; border-radius:14px; overflow:hidden; background:#0e0d0f; }
    figure canvas { width:100%; height:auto; display:block; }
    figcaption { font-family:"JetBrains Mono",monospace; font-size:0.8rem; color:var(--muted); padding:12px 16px; border-top:1px solid #2a2630; }
    .themes { margin-top:16px; display:inline-flex; gap:6px; border:1px solid #2a2630; border-radius:999px; padding:4px; }
    .themes button { font:inherit; font-size:0.82rem; cursor:pointer; border:0; background:transparent; color:var(--muted); padding:5px 16px; border-radius:999px; }
    .themes button.on { background:#2fc3b4; color:#0b0a0c; font-weight:600; }
    body.light figure { border-color:#ddd3c6; background:#f4efe9; }
    body.light figcaption { border-top-color:#ddd3c6; color:#6c645c; }
    body.light .themes { border-color:#ddd3c6; }
    body.light .themes button.on { background:#0e9384; color:#fff; }
  </style>
</head>
<body>
  <header>
    <h1>Data Science · AI · Computer Science — animation set</h1>
    <p>Ten uniform 6-second loops, one shared visual system. Click a tile to open it full-size.</p>
    <div class="themes" id="themes">
      <button data-theme="dark" class="on">dark</button>
      <button data-theme="light">light</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>

  <script src="engine.js"></script>
  <script src="scenes/01-latent-space.js"></script>
  <script src="scenes/02-gradient-descent.js"></script>
  <script src="scenes/03-neural-net.js"></script>
  <script src="scenes/04-k-means.js"></script>
  <script src="scenes/05-decision-boundary.js"></script>
  <script src="scenes/06-attention.js"></script>
  <script src="scenes/07-gmm-density.js"></script>
  <script src="scenes/08-sorting.js"></script>
  <script src="scenes/09-graph-search.js"></script>
  <script src="scenes/10-convolution.js"></script>
  <script>
    const grid = document.getElementById('grid');
    let players = [];

    function render(theme) {
      players.forEach((p) => p.stop());
      players = [];
      grid.innerHTML = '';
      document.body.classList.toggle('light', theme === 'light');
      document.body.style.background = theme === 'light' ? '#efe9e1' : '#0b0a0c';
      document.body.style.color = theme === 'light' ? '#2a2723' : '#f3eee9';
      for (const scene of window.Anim.list()) {
        const fig = document.createElement('figure');
        const cv = document.createElement('canvas');
        const cap = document.createElement('figcaption');
        cap.textContent = scene.id + '  //  ' + scene.label;
        const link = document.createElement('a');
        link.href = 'scene.html?scene=' + scene.id + '&theme=' + theme;
        link.style.display = 'block';
        link.appendChild(cv);
        fig.appendChild(link); fig.appendChild(cap); grid.appendChild(fig);
        const a = window.Anim.mount(cv, scene.id, theme); a.play(); players.push(a);
      }
    }

    document.getElementById('themes').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#themes button').forEach((x) => x.classList.toggle('on', x === b));
      render(b.dataset.theme);
    });
    render('dark');
  </script>
</body>
</html>
